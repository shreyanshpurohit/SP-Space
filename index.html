<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sp's Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            text-shadow: none !important;
            filter: none !important;
        }

        body {
            background-color: #030a1c;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            z-index: 1;
        }

        #canvas:active {
            cursor: grabbing;
        }

        header {
            position: fixed;
            top: 24px;
            left: 28px;
            right: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .logo {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #ffffff;
        }

        #mode-badge {
            display: none;
            position: fixed;
            top: 64px;
            left: 28px;
            background: rgba(8, 23, 53, 0.9);
            color: #94a3b8;
            font-size: 0.78rem;
            padding: 6px 12px;
            border-radius: 8px;
            z-index: 10;
            max-width: 480px;
            line-height: 1.4;
        }
        #mode-badge strong {
            color: #60a5fa;
        }

        .switcher {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: #081735;
            padding: 6px;
            border-radius: 0;
            z-index: 10;
        }

        .tab-btn {
            background: #ffffff;
            color: #030a1c;
            padding: 10px 22px;
            border-radius: 0;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.55;
            transition: opacity 0.15s ease;
            letter-spacing: 0.5px;
        }

        .tab-btn:hover {
            opacity: 0.85;
        }

        .tab-btn.active {
            opacity: 1.0;
            font-weight: 700;
        }

        .info-panel {
            position: fixed;
            bottom: 32px;
            left: 28px;
            max-width: 420px;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .info-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .info-desc {
            font-size: 0.94rem;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .controls-right {
            position: fixed;
            bottom: 32px;
            right: 28px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            background: #ffffff;
            color: #030a1c;
            padding: 10px 22px;
            border-radius: 0;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            opacity: 1.0;
            transition: opacity 0.15s ease;
            letter-spacing: 0.5px;
        }

        .ctrl-btn:hover {
            opacity: 0.85;
        }

        .ctrl-btn.off {
            opacity: 0.45;
        }

        @media (max-width: 768px) {
            header { top: 16px; left: 16px; right: 16px; }
            .info-panel {
                bottom: 92px;
                left: 16px;
                right: 16px;
                max-width: none;
            }
            .info-title { font-size: 1.8rem; }
            .switcher {
                bottom: 20px;
                width: calc(100% - 32px);
                justify-content: center;
                overflow-x: auto;
            }
            .controls-right { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Sp's Space</div>
    </header>

    <div id="mode-badge"></div>

    <div class="info-panel" id="info-panel">
        <h1 class="info-title" id="planet-name">Earth</h1>
        <p class="info-desc" id="planet-desc">The third planet from the Sun and the only astronomical object known to harbor life, covered by liquid oceans and rotating atmosphere.</p>
    </div>

    <div class="switcher">
        <button class="tab-btn" data-planet="all">All</button>
        <button class="tab-btn active" data-planet="earth">Earth</button>
        <button class="tab-btn" data-planet="saturn">Saturn</button>
        <button class="tab-btn" data-planet="mars">Mars</button>
    </div>

    <div class="controls-right">
        <button class="ctrl-btn" id="btn-rotate">Auto-Rotate</button>
    </div>

    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="main.js"></script>
</body>
</html>
